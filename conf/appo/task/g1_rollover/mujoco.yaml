# @package _global_
# G1 roll-over (prone/face-down recovery) task, ported from HumanUP's
# g1waistroll Stage-I recipe (https://github.com/RunpeiDong/HumanUP).
# Same env/reward code as g1_getup (conf/appo/task/g1_getup/mujoco.yaml) --
# only the starting keyframe differs (prone vs supine). See that file's
# comments for reward-weight provenance.
training:
  task_name: G1RollOver
  sim_backend: mujoco
algo:
  max_iterations: 3000
  save_interval: 100
env:
  control_config:
    action_scale: 0.5
reward:
  scales:
    getup_height: 5.0
    orientation: -1.0
    upright: 2.0
    pose: -0.05
    action_rate: -0.1
  base_height_target: 0.754
